<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — KOÇYİĞİT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808; --tx: #f0ede8; --tx-2: rgba(240,237,232,0.52); --tx-3: rgba(240,237,232,0.24);
      --gold: #c9a96e; --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--tx); font-family: var(--sans); font-weight: 300;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; -webkit-font-smoothing: antialiased;
    }
    .err-num {
      font-family: var(--serif); font-size: clamp(5rem, 18vw, 12rem); font-weight: 300;
      line-height: 1; color: var(--tx-3); letter-spacing: -0.02em; margin-bottom: 16px;
    }
    .err-num span { color: var(--gold); }
    .err-title { font-family: var(--serif); font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 300; margin-bottom: 12px; }
    .err-sub { font-size: 0.88rem; color: var(--tx-2); margin-bottom: 36px; max-width: 380px; margin-left: auto; margin-right: auto; }
    .err-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; background: var(--gold); color: #fff;
      text-decoration: none; font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; transition: opacity 0.2s;
    }
    .err-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div>
    <div class="err-num">5<span>0</span>0</div>
    <h1 class="err-title">Serverfehler</h1>
    <p class="err-sub">Etwas ist schiefgelaufen. Wir arbeiten bereits daran, das Problem zu beheben.</p>
    <a href="/" class="err-btn">← Zurück zum Shop</a>
  </div>
</body>
</html>
