<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — KOÇYİĞİT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #080808;
      --sf: #111111;
      --sf-2: #1a1a1a;
      --bd: rgba(255,255,255,0.07);
      --bd-gold: rgba(201,169,110,0.22);
      --tx: #f0ede8;
      --tx-2: rgba(240,237,232,0.52);
      --tx-3: rgba(240,237,232,0.24);
      --gold: #c9a96e;
      --gold-h: #b8955a;
      --gold-bg: rgba(201,169,110,0.08);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--tx);
      font-family: var(--sans);
      font-weight: 300;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
    }
    .login-logo {
      font-family: var(--serif);
      font-size: 1.4rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--tx);
      text-align: center;
      margin-bottom: 6px;
    }
    .login-logo span { color: var(--gold); }
    .login-sub {
      text-align: center;
      font-size: 0.72rem;
      color: var(--tx-3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .login-card {
      background: var(--sf);
      border: 1px solid var(--bd);
      padding: 32px;
    }
    .login-title {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--tx-3);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--bd);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--tx-3);
    }
    .form-input {
      background: var(--sf-2);
      border: 1px solid var(--bd);
      color: var(--tx);
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 300;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-bg);
    }
    .form-input::placeholder { color: var(--tx-3); }
    .login-btn {
      width: 100%;
      background: var(--gold);
      color: #fff;
      border: none;
      padding: 13px 24px;
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover { background: var(--gold-h); }
    .login-btn:active { transform: scale(0.98); }
    #login-error {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #f87171;
      font-size: 0.78rem;
      padding: 10px 14px;
      margin-top: 14px;
      text-align: center;
    }
    .login-back {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 0.76rem;
      color: var(--tx-3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-back:hover { color: var(--tx); }
    .login-back i { margin-right: 4px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">KOÇYİĞİT<span>.</span></div>
    <div class="login-sub">Administratorbereich</div>

    <div class="login-card">
      <div class="login-title">Anmelden</div>

      <form id="loginForm" onsubmit="doLogin(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginUsername">Benutzername</label>
          <input type="text" id="loginUsername" class="form-input" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Passwort</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">
          <i class="fas fa-right-to-bracket"></i>
          Anmelden
        </button>
        <div id="login-error">Ungültige Anmeldedaten. Bitte versuche es erneut.</div>
      </form>
    </div>

    <a href="/" class="login-back">
      <i class="fas fa-arrow-left"></i>
      Zurück zum Shop
    </a>
  </div>

  <script>
  async function doLogin(e){
    e.preventDefault();
    var errEl  = document.getElementById('login-error');
    var btn    = e.target.querySelector('.login-btn');
    var user   = document.getElementById('loginUsername').value.trim();
    var pass   = document.getElementById('loginPassword').value;

    errEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Anmelden…';

    try {
      var res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username: user, password: pass})
      });
      var data = await res.json();
      if(res.ok && data.token){
        localStorage.setItem('adminToken', data.token);
        window.location.href = '/admin.html';
      } else {
        throw new Error(data.message || 'Fehler');
      }
    } catch(err){
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Anmelden';
    }
  }
  </script>
</body>
</html>
